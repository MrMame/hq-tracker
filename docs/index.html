<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine GitHub PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Meine erste GitHub PWA</h1>
        <p>Diese App funktioniert jetzt auch offline!</p>
    </div>

    <script>
        // Dynamische Ermittlung des Scopes für GitHub Pages Unterordner
        const scope = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js', { scope: scope })
                    .then(reg => console.log('Service Worker registriert am Scope: ', reg.scope))
                    .catch(err => console.error('Service Worker Registrierung fehlgeschlagen: ', err));
            });
        }
    </script>
</body>
</html>
